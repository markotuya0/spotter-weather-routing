# Render Blueprint (docs/08-execution-plan.md G6). Two services: the Django
# API (web service) and the Vite SPA (static site). No database — the app is
# stateless (config/settings.py: sqlite ":memory:" only to satisfy Django's
# unused contenttypes/auth apps).
services:
  - type: web
    name: spotter-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: ALLOWED_HOSTS
        sync: false # set to the deployed backend hostname, e.g. spotter-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false # set to the deployed frontend origin, e.g. https://spotter-frontend.onrender.com
      - key: TOMTOM_API_KEY
        sync: false
      - key: HERE_API_KEY
        sync: false
      - key: ROUTING_PROVIDER
        value: tomtom
      - key: NUM_PROXIES
        # Render's edge is Cloudflare + Render's own LB -- 2 hops, confirmed
        # empirically (docs/09-decisions.md). This has a literal `value:`
        # (not `sync: false`) deliberately: it must stay version-controlled
        # so a Blueprint resync can't silently revert it to "1" again, which
        # previously collapsed distinct anonymous clients onto one shared
        # throttle identity and caused false-positive 429s.
        value: "2"

  - type: web
    name: spotter-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # set to the deployed backend's /api, e.g. https://spotter-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
